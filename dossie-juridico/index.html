<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#132238">
<title>Dossiê Jurídico — Fábio × Premium</title>
<style>
html,body{margin:0;background:#132238;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}#loading strong{font-size:1.05rem}small{opacity:.65}
</style>
</head>
<body>
<div id="loading"><div><strong>Carregando dossiê jurídico…</strong><br><small>Fábio Regis de Carvalho × Premium</small></div></div>
<script>
(async()=>{
  try{
    const base='https://raw.githubusercontent.com/nicholaspiccoli/acao-fabio-linha-historica-fatos/main/payload/';
    const files=[base+'01.txt',base+'02.txt',base+'03.txt',base+'04.txt'];
    const b64=(await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{
      if(!r.ok) throw new Error(f+' '+r.status);
      return r.text();
    })))).join('').replace(/\s+/g,'');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('Navegador sem suporte a descompressão nativa.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='<div><strong>Falha ao carregar o dossiê.</strong><br><small>'+String(e)+'</small></div>';
  }
})();
</script>
</body>
</html>
