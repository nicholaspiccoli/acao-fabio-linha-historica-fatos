<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Dossiê Jurídico — Fábio × Premium</title><style>html,body{margin:0;background:#132238;color:#fff;font-family:system-ui,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}small{opacity:.65}</style></head><body><div id="loading"><div><strong>Carregando dossiê jurídico…</strong><br><small>Fábio Regis de Carvalho × Premium</small></div></div><script>(async()=>{try{const files=['/chunks/001.txt','/chunks/002.txt','/chunks/003.txt','/chunks/004.txt','/chunks/005.txt','/chunks/006.txt','/chunks/007.txt'];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.getElementById('loading').innerHTML='<div><strong>Falha ao carregar o dossiê.</strong><br><small>'+String(e)+'</small></div>'}})();</script></body></html>
