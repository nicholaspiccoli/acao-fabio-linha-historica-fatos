name: Materialize static site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild site from reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/site.part* | base64 --decode > /tmp/acao-fabio-site.tar.gz
          tar -xzf /tmp/acao-fabio-site.tar.gz -C .
          test -s index.html
          test -s styles.css
          test -s motion.js
          node --check motion.js
          python -m json.tool vercel.json >/dev/null

      - name: Commit materialized production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css motion.js robots.txt vercel.json README.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'build: materialize production site [skip ci]'
          git push
